[project]
site_url = "https://mateus-lopes.github.io/trilha-programacao/"
site_name = "Primeiros Passos no Código"
site_description = "Uma trilha leve para aprender programação do zero, com HTML, CSS e JavaScript."
site_author = "Mateus Lopes"
copyright = "Feito com carinho 🌱"

repo_url = "https://github.com/mateus-lopes/trilha-programacao"
repo_name = "mateus-lopes/trilha-programacao"

nav = [
  { "Início" = "index.md" },
  { "Módulo 0 · Preparando o cantinho" = [
    "modulo0/index.md",
    { "0.1 · Sessão 0" = "modulo0/aula01-sessao-0.md" },
    { "0.2 · Como usar esta trilha" = "modulo0/aula02-como-usar-a-trilha.md" },
  ] },
  { "Módulo 1 · Pensando como programadora" = [
    "modulo1/index.md",
    { "1.1 · O que é programar?" = "modulo1/aula01-o-que-e-programar.md" },
    { "1.2 · O computador é bem literal" = "modulo1/aula02-computador-literal.md" },
    { "1.3 · Decisões e repetições" = "modulo1/aula03-decisoes-e-repeticoes.md" },
  ] },
  { "Glossário" = "glossario.md" },
]

[project.theme]
language = "pt-BR"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/sprout"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "pink"
accent = "pink"
toggle.icon = "lucide/sun-moon"
toggle.name = "Mudar para o modo claro"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "pink"
accent = "pink"
toggle.icon = "lucide/sun"
toggle.name = "Mudar para o modo escuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "pink"
accent = "pink"
toggle.icon = "lucide/moon"
toggle.name = "Seguir o sistema"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
